name: Frontend quality gate
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-quality.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit CSS ownership
        run: npm run audit:css
      - name: Vite source check
        run: npm run check
      - name: Production page build
        run: npm run build
      - name: Upload CSS audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: css-ownership-audit
          path: tmp/css-ownership-audit.json
          if-no-files-found: ignore
