name: Synchronize authoritative Lagom main
on:
  push:
    branches:
      - sync/source-main-20261017
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch and safely synchronize authoritative source
        env:
          EXPECTED_DEST: 241adad5f93304de6b6cb5a1a5bb7426eac8b947
          EXPECTED_SOURCE: e0eaecb6c121d7825242d414bdcac9b0716a3bc4
        shell: bash
        run: |
          set -euo pipefail
          git remote add authoritative https://github.com/elliotttmiller/lagom-naturals.git
          git fetch --no-tags authoritative refs/heads/main
          actual_source="$(git rev-parse FETCH_HEAD)"
          test "$actual_source" = "$EXPECTED_SOURCE" || { echo "Source moved. Refusing unsafe sync."; exit 1; }
          git fetch --no-tags origin refs/heads/main
          actual_dest="$(git rev-parse FETCH_HEAD)"
          test "$actual_dest" = "$EXPECTED_DEST" || { echo "Destination moved. Refusing unsafe sync."; exit 1; }
          git merge-base --is-ancestor "$EXPECTED_DEST" "$EXPECTED_SOURCE" || { echo "Refusing non-fast-forward sync."; exit 1; }
          git push origin "$EXPECTED_SOURCE:refs/heads/main" --force-with-lease="refs/heads/main:$EXPECTED_DEST"
          git fetch --no-tags origin refs/heads/main
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SOURCE"
